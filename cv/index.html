<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nathan de Castro — Curriculum Vitae. View online, download as PDF, or print, in English or French."
    />
    <meta name="author" content="Nathan de Castro" />
    <meta name="theme-color" content="#161616" />
    <title>Nathan de Castro — CV</title>
    <link rel="canonical" href="https://nathandecastro.com/cv/" />
    <link rel="shortcut icon" type="image/png" href="/img/spock.png" />

    <link
      href="/vendor/font-awesome/css/font-awesome.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="/css/site-nav.css" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "Comfortaa", "Segoe UI", Arial, sans-serif;
        background: #161616;
        color: #ffffff;
      }

      .cv-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding-top: 51px;
        background:
          radial-gradient(circle at top left, rgba(240, 95, 64, 0.18), transparent 32%),
          radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.06), transparent 28%),
          #161616;
      }

      .cv-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .cv-toolbar__lang {
        display: inline-flex;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        padding: 3px;
      }

      .cv-lang-btn {
        appearance: none;
        border: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.68);
        font-family: inherit;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .cv-lang-btn:hover,
      .cv-lang-btn:focus {
        color: #ffffff;
      }

      .cv-lang-btn.is-active {
        background: #f05f40;
        color: #ffffff;
        box-shadow: 0 6px 16px rgba(240, 95, 64, 0.4);
      }

      .cv-toolbar__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .cv-toolbar__btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 10px 20px;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.03em;
        text-decoration: none !important;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff !important;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      }

      .cv-toolbar__btn:hover,
      .cv-toolbar__btn:focus {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }

      .cv-toolbar__btn--primary {
        background: #f05f40;
        border-color: #f05f40;
        box-shadow: 0 10px 24px rgba(240, 95, 64, 0.32);
      }

      .cv-toolbar__btn--primary:hover,
      .cv-toolbar__btn--primary:focus {
        background: #d44e34;
        border-color: #d44e34;
      }

      .cv-viewer {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0 20px 18px;
      }

      .cv-viewer__frame-wrap {
        flex: 1;
        border-radius: 18px;
        overflow: hidden;
        background: #2a2a2a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .cv-viewer__frame-wrap iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .cv-viewer__fallback {
        margin: 10px 4px 0;
        font-size: 13px;
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
      }

      .cv-viewer__fallback a {
        color: #ff9a80;
      }

      @media (max-width: 600px) {
        .cv-toolbar {
          justify-content: center;
        }

        .cv-toolbar__actions {
          justify-content: center;
          width: 100%;
        }

        .cv-viewer {
          padding: 0 10px 14px;
        }
      }
    </style>
  </head>
  <body>
    <nav
      class="site-nav"
      data-site-nav
      data-site-nav-page="cv"
      data-site-nav-mode="solid"
    ></nav>

    <main class="cv-page">
      <div class="cv-toolbar">
        <div class="cv-toolbar__lang" role="group" aria-label="CV language">
          <button
            type="button"
            class="cv-lang-btn"
            data-lang="en"
            aria-pressed="false"
          >
            EN
          </button>
          <button
            type="button"
            class="cv-lang-btn"
            data-lang="fr"
            aria-pressed="false"
          >
            FR
          </button>
        </div>
        <div class="cv-toolbar__actions">
          <button type="button" class="cv-toolbar__btn" id="cv-print-btn">
            <i class="fa fa-print" aria-hidden="true"></i> Print
          </button>
          <a
            class="cv-toolbar__btn cv-toolbar__btn--primary"
            id="cv-download-btn"
            href="/doc/cv_en.pdf"
            download="Nathan-de-Castro-CV-EN.pdf"
          >
            <i class="fa fa-download" aria-hidden="true"></i> Download
          </a>
        </div>
      </div>

      <div class="cv-viewer">
        <div class="cv-viewer__frame-wrap">
          <iframe
            id="cv-frame"
            src="/doc/cv_en.pdf"
            title="Nathan de Castro — CV"
          ></iframe>
        </div>
        <p class="cv-viewer__fallback">
          Preview not showing?
          <a id="cv-fallback-link" href="/doc/cv_en.pdf" target="_blank" rel="noopener"
            >Open the PDF directly</a
          >.
        </p>
      </div>
    </main>

    <script src="/js/site-nav.js" defer></script>
    <script>
      (function () {
        var frame = document.getElementById("cv-frame");
        var downloadBtn = document.getElementById("cv-download-btn");
        var fallbackLink = document.getElementById("cv-fallback-link");
        var printBtn = document.getElementById("cv-print-btn");
        var langButtons = document.querySelectorAll(".cv-lang-btn");

        var files = { en: "/doc/cv_en.pdf", fr: "/doc/cv_fr.pdf" };
        var downloadNames = {
          en: "Nathan-de-Castro-CV-EN.pdf",
          fr: "Nathan-de-Castro-CV-FR.pdf",
        };
        var titles = {
          en: "Nathan de Castro — CV",
          fr: "Nathan de Castro — CV (Français)",
        };

        function detectDefaultLang() {
          var stored;
          try {
            stored = localStorage.getItem("cv-lang");
          } catch (e) {
            stored = null;
          }
          if (stored === "en" || stored === "fr") return stored;

          var userLanguage = (
            navigator.language ||
            navigator.userLanguage ||
            ""
          ).toLowerCase();
          return userLanguage.indexOf("fr") === 0 ? "fr" : "en";
        }

        function setLang(lang) {
          var href = files[lang] || files.en;

          frame.src = href;
          downloadBtn.href = href;
          downloadBtn.setAttribute(
            "download",
            downloadNames[lang] || downloadNames.en
          );
          fallbackLink.href = href;
          document.title = titles[lang] || titles.en;

          langButtons.forEach(function (btn) {
            var isActive = btn.getAttribute("data-lang") === lang;
            btn.classList.toggle("is-active", isActive);
            btn.setAttribute("aria-pressed", String(isActive));
          });

          try {
            localStorage.setItem("cv-lang", lang);
          } catch (e) {
            // localStorage unavailable; language choice just won't persist.
          }
        }

        langButtons.forEach(function (btn) {
          btn.addEventListener("click", function () {
            setLang(btn.getAttribute("data-lang"));
          });
        });

        printBtn.addEventListener("click", function () {
          try {
            frame.contentWindow.focus();
            frame.contentWindow.print();
          } catch (e) {
            window.open(frame.src, "_blank");
          }
        });

        setLang(detectDefaultLang());
      })();
    </script>
  </body>
</html>
