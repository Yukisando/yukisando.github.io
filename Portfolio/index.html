<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nathan de Castro - Game Developer Portfolio">
  <meta name="author" content="Nathan de Castro">
  <meta name="theme-color" content="#F05F40">
  <title>Nathan de Castro - Game Developer Portfolio</title>
  <link rel="shortcut icon" type="image/png" href="/img/spock.png" />
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700' rel='stylesheet' type='text/css'>
  
  <!-- Font Awesome -->
  <link href="/vendor/font-awesome/css/font-awesome.css" rel="stylesheet" type="text/css">
  
  <!-- Simple Portfolio CSS -->
  <link href="/Portfolio/css/portfolio.css" rel="stylesheet">
</head>

<body>
  <!-- Navigation -->
  <nav style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(34, 34, 34, 0.95);
    backdrop-filter: blur(10px);
    z-index: 1000;
    padding: 15px 0;
    box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
  ">
    <div style="
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    ">
      <a href="/" style="
        color: #F05F40;
        font-weight: 700;
        font-size: 1.4rem;
        text-decoration: none;
      ">Nathan de Castro</a>
      
      <div style="display: flex; gap: 30px; align-items: center;">
        <a href="/#about" style="
          color: white;
          text-decoration: none;
          font-weight: 600;
          transition: color 0.3s ease;
        " onmouseover="this.style.color='#F05F40'" onmouseout="this.style.color='white'">About</a>

        <a href="/coldsnap/" style="
          color: white;
          text-decoration: none;
          font-weight: 600;
          transition: color 0.3s ease;
        " onmouseover="this.style.color='#F05F40'" onmouseout="this.style.color='white'">ColdSnap</a>

        <a href="/doc/cv_en.pdf" id="nav-cv-link" style="
          color: white;
          text-decoration: none;
          font-weight: 600;
          transition: color 0.3s ease;
        " onmouseover="this.style.color='#F05F40'" onmouseout="this.style.color='white'">Resume/CV</a>

        <a href="/#contact" style="
          color: white;
          text-decoration: none;
          font-weight: 600;
          transition: color 0.3s ease;
        " onmouseover="this.style.color='#F05F40'" onmouseout="this.style.color='white'">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Portfolio Section -->
  <section id="portfolio">
    <div id="portfolio-root"></div>
  </section>

  <!-- Simple Portfolio Script -->
  <script src="/Portfolio/js/portfolio.js"></script>

  <script>
    // Language detection for CV link
    (function() {
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (lang.startsWith('fr')) {
        var cvLink = document.getElementById('nav-cv-link');
        if (cvLink) cvLink.href = '/doc/cv_fr.pdf';
      }
    })();
  </script>
</body>

</html>
