<!DOCTYPE html>
<html lang="en-us">

	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<title>GrappleGroove</title>
		<style>
		html,
		body {
			background: FFFFFF;
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}
	</style>
	</head>

	<body>
		<div id="gameContainer">
			<canvas id="unity-canvas"
				data-pixel-art=""></canvas>
			<script src="Build/GrappleGroove.loader.js"></script>
			<script>
			var canvas = document.querySelector("#unity-canvas");
			var config = {
				dataUrl: "Build/GrappleGroove.data",
				frameworkUrl: "Build/GrappleGroove.framework.js",
				codeUrl: "Build/GrappleGroove.wasm",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "ColdSnap",
				productName: "GrappleGroove",
				productVersion: "0.9",
				// We own the canvas drawing-buffer size. With this false, Unity will NOT
				// resize the backing buffer to (cssSize * devicePixelRatio) every frame,
				// so the render resolution stays exactly RENDER_WIDTH x RENDER_HEIGHT and
				// does not get multiplied up on HiDPI / scaled displays.
				matchWebGLToCanvasSize: false,
				devicePixelRatio: 1,
			};

			// Fixed internal render resolution. Driven by the WebGL Player Settings
			// resolution (Project Settings > Player > Resolution and Presentation).
			// Keep this low for performance — the CSS below scales it to the window.
			var RENDER_WIDTH = 1920;
			var RENDER_HEIGHT = 1080;

			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}
			function onResize() {
				var container = canvas.parentElement;

				// 1. Lock the WebGL backing buffer to the low render resolution.
				canvas.width = RENDER_WIDTH;
				canvas.height = RENDER_HEIGHT;

				// 2. Scale the canvas (display only, via CSS) to fill the browser
				//    window while preserving the render aspect ratio.
				var aspect = RENDER_WIDTH / RENDER_HEIGHT;
				var w = window.innerWidth;
				var h = window.innerHeight;
				if (w / h > aspect) {
					w = Math.ceil(h * aspect);
				} else {
					h = Math.ceil(w / aspect);
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
			}
			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				canvas = instance.Module.canvas;
				onResize();
			});
			window.addEventListener('resize', onResize);
			onResize();

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				// Mobile device style: fill the whole browser client area with the game canvas:
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}
		</script>
		</div>
	</body>

</html>
