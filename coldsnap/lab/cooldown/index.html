<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cooldown Sans, la police de ColdSnap</title>
  <meta name="description" content="Cooldown Sans, la police de ColdSnap : pensée pour les lecteurs dyslexiques et malvoyants, réglable en direct.">
  <link rel="canonical" href="https://coldsnap.fr/lab/cooldown/">
  <link rel="preload" href="/fonts/Cooldown-var.woff2?v=20261120c" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/lab/cooldown/lab.css?v=20261120h">
  <script src="/lab/cooldown/lab.js?v=20261120h" defer></script>
</head>
<body>
  <main class="lab">
    <div class="lab__sample" id="sample" contenteditable="true" spellcheck="false">Cooldown Sans<br><span class="lab__pairs">bdpq ij !</span></div>

    <div class="lab__presets" id="presets"></div>

    <div class="lab__controls">
      <label class="lab__slider"><span data-t="weight">Graisse</span><input type="range" id="wght" min="300" max="700" step="any" value="400"></label>
      <label class="lab__slider"><span data-t="xheight">Hauteur des minuscules</span><input type="range" id="xhgt" min="470" max="600" step="any" value="547"></label>
      <label class="lab__slider"><span data-t="wobble">Bancal</span><input type="range" id="wobl" min="0" max="1" step="any" value="0"></label>
      <div class="lab__toggles">
        <label class="lab__switch"><input type="checkbox" role="switch" id="tail"><span data-t="tail">Queues sur d et q</span></label>
        <label class="lab__switch"><input type="checkbox" role="switch" id="spark"><span data-t="spark">Points en flocon</span></label>
      </div>
    </div>
    <p class="lab__css" id="css"></p>
  </main>
</body>
</html>
