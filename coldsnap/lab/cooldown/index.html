<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cooldown, la police de ColdSnap</title>
  <meta name="description" content="Cooldown, la police de ColdSnap : plus lisible pour les lecteurs dyslexiques, réglable en direct.">
  <link rel="canonical" href="https://coldsnap.fr/lab/cooldown/">
  <link rel="preload" href="/fonts/Cooldown-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/lab/cooldown/lab.css?v=20261120b">
  <script src="/lab/cooldown/lab.js?v=20261120b" defer></script>
</head>
<body>
  <main class="lab">
    <div class="lab__sample" id="sample" contenteditable="true" spellcheck="false">Cooldown ❄<br><span class="lab__pairs">bdpq</span></div>

    <div class="lab__stories" role="tablist" id="stories"></div>
    <p class="lab__story" id="story" aria-live="polite"></p>

    <div class="lab__controls">
      <label class="lab__slider"><span data-t="weight">Graisse</span><input type="range" id="wght" min="300" max="700" value="400"><output id="wghtOut">400</output></label>
      <label class="lab__slider"><span data-t="xheight">Hauteur des minuscules</span><input type="range" id="xhgt" min="470" max="600" value="547"><output id="xhgtOut">547</output></label>
      <label class="lab__slider"><span data-t="wobble">Bancal</span><input type="range" id="wobl" min="0" max="1" step="0.01" value="0"><output id="woblOut">0</output></label>
      <div class="lab__toggles">
        <label class="lab__chip"><input type="checkbox" id="tail"><span data-t="tail">Queues sur d et q</span></label>
        <label class="lab__chip"><input type="checkbox" id="spark"><span data-t="spark">Points en étoile</span></label>
        <label class="lab__chip"><input type="checkbox" id="compare"><span data-t="compare">Comparer à Comfortaa</span></label>
      </div>
    </div>
    <div class="lab__compare" id="compareBox" hidden>
      <span class="lab__compare-label">Comfortaa</span>
      <div class="lab__compare-text" id="compareText"></div>
    </div>
    <p class="lab__css" id="css"></p>
  </main>
</body>
</html>
