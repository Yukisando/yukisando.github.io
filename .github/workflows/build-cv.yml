name: Build CV PDFs

# doc/cv_en.md and doc/cv_fr.md are the source of truth for the CV.
# When either changes, rebuild the HTML that /cv/ embeds and the PDFs it offers
# for download, commit them back, and publish — so editing the markdown on
# github.com is all it takes.
on:
  push:
    branches: [master]
    paths:
      - 'doc/cv_en.md'
      - 'doc/cv_fr.md'
      - 'tools/cv/build-cv.mjs'
      - 'fonts/Comfortaa-VariableFont_wght.ttf'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write # commit the rebuilt PDFs
  pages: write # request the Pages rebuild that publishes them

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The runner image ships Google Chrome, so the build needs no npm install.
      - name: Show browser version
        run: google-chrome --version

      # Fails the job if a CV no longer fits 2 pages, rather than publishing a
      # silently-overflowing PDF. See tools/cv/README.md.
      - name: Build PDFs
        run: node tools/cv/build-cv.mjs

      - name: Commit rebuilt CV
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="doc/cv_en.html doc/cv_fr.html doc/cv_en.pdf doc/cv_fr.pdf"
          if git diff --quiet -- $FILES; then
            echo "CV unchanged, nothing to commit."
            exit 0
          fi
          git add $FILES
          git commit -m "chore(cv): rebuild CV from markdown"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # This site is served by the legacy branch-based Pages builder, which
      # normally rebuilds on every push to master. It does NOT react to a push
      # made with GITHUB_TOKEN, so the commit above would land without going
      # live. Requesting the build explicitly closes that gap.
      - name: Publish to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
