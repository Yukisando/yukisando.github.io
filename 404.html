<!DOCTYPE html>
<!-- GitHub Pages shows this page for every unknown address on nathandecastro.com. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Nathan de Castro</title>
  <script>
    // ColdSnap moved to coldsnap.fr: old nathandecastro.com/coldsnap/... addresses that have
    // no stub page (_coldsnap_redirects/) go to the same path there, keeping ?query and #hash.
    if (/^\/coldsnap(\/|$)/i.test(location.pathname)) {
      location.replace('https://coldsnap.fr' + (location.pathname.replace(/^\/coldsnap/i, '') || '/') + location.search + location.hash);
    }
  </script>
  <link rel="shortcut icon" type="image/png" href="/img/spock.png">
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    h1 { font-size: 3rem; margin: 0 0 .5rem; }
    a { color: #F05F40; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist. <a href="/">Back to nathandecastro.com</a></p>

</body>
</html>
